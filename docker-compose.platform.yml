services:

  pdp:
    build: ./pdp
    ports:
      - "8080:8080"
    environment:
      - PDP_PORT=8080
      - LOG_LEVEL=info
      - NODE_ENV=production
    volumes:
      - ./pdp/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  superlink:
    build: ./superlink
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    environment:
      - PDP_DECISION_URL=http://pdp:8080/getDecision
    volumes:
      - superlink-data:/app/.flwr
    restart: unless-stopped
    depends_on:
      pdp:
        condition: service_healthy

volumes:
  superlink-data:
