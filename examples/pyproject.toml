[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-abac"
version = "1.0.0"
description = ""
license = "Apache-2.0"

dependencies = [
    "pandas",
    "scikit-learn",
    "torch",
    "datasets",
    "numpy",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fz285"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "medical.server_app:app"
clientapp = "medical.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 2
fraction-train = 0.5
local-epochs = 1
lr = 0.01
min-fit-clients = 2 
min-evaluate-clients = 2 
min-available-clients = 2

