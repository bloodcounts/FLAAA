[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-abac"
version = "1.0.0"
description = "Governed federated learning with Flower and PyTorch"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "pandas",
    "scikit-learn",
    "torch",
    "datasets",
    "numpy",
    "flwr[simulation]==1.36.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["medical"]
exclude = ["medical/*_data/**", "**/*.csv", "**/*.npz", "**/*.npy", "**/*.pt", "**/*.jsonl", "**/__pycache__/**"]

[tool.flwr.app]
publisher = "fz285"

# Point to your ServerApp and ClientApp objects
[tool.flwr.app.components]
serverapp = "medical.server_app:app"
clientapp = "medical.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num_rounds = 15
local_epochs = 2
learning_rate = 0.001
batch_size = 64
hidden_dims = "64,32"
dropout = 0.3
fraction_train = 1.0
fraction_evaluate = 1.0
min_available_clients = 25
strategy = "fedavg"
governance_enabled = true
register_simulated_nodes = false
proximal_mu = 0.01
federation = "default"
icnn_alpha = 0.1
icnn_lr = 0.001
icnn_steps = 2
fault_profile = "nominal"
fault_seed = 0
fault_fraction = 0.2
fault_base_delay_s = 0.1
fault_straggler_delay_s = 1.0

# SuperLink connections are configured in flwr-config.toml.
